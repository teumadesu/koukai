<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>作成ソフト・サイト一覧</title>
  <style>
    .box { border: 2px solid black; padding: 10px; margin: 20px; }
    img.gallery { cursor: pointer; }
    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    #modal img { max-width: 80%; max-height: 80%; }
    .nav-btn { position: absolute; color: white; font-size: 50px; cursor: pointer; user-select: none; padding: 10px; }
    #prev { left: 20px; }
    #next { right: 20px; }
  </style>
</head>
<body>
  <h1>作成ソフト一覧</h1>
  <h2>※readmeをお読みください</h2>

  <div class="box">
    <h3>TUM防災 V1</h3>
    <p>2026年7月23日公開<br>TUM防災ソフトV1公開！シンプルな設計で、地震情報を入手！</p>
    <h3>機能</h3>
    <p>・自動更新<br>・震度ごとに色分け<br>津波の有無</p>
    <s><a href="TUM防災ソフト.V1.exe" download="TUM防災ソフト.V1.exe">TUM防災はこちらからダウンロード</a></s>
    <b><p style="color:red;">アプリのバージョンが古いため一部の機種では起動できないため最新V公開まで使用非推奨。</p></b>
    <img class="gallery" src="tumbousai1.png" alt="防災ソフトの動作の様子" width="200" height="100">
  </div>

  <div class="box">
    <h3>便利時計</h3>
    <p>2026年9月5日公開<br>機能豊富で様々な用途に使える時計。</p>
    <h2>機能</h2>
    <p>・日付(曜日)<br>・時間(xx:xx:xx)<br>・アラーム機能<br>・やることリスト<br>・メモ帳<br>・ストップウォッチ<br>・電卓<br>・PWAでインストール</p>
    <hr>
    <img class="gallery" src="clock1.png" alt="実際の動作の様子" width="200" height="100">
    <img class="gallery" src="clock2.png" alt="実際の動作の様子" width="200" height="100">
    <img class="gallery" src="clock3.png" alt="実際の動作の様子" width="200" height="100">
  </div>

  <!-- 画像拡大するやつ -->
  <div id="modal" onclick="if(event.target===this) this.style.display='none'">
    <span id="prev" class="nav-btn" onclick="move(-1)">&#10094;</span>
    <img id="modalImg">
    <span id="next" class="nav-btn" onclick="move(1)">&#10095;</span>
  </div>

  <script>
    const imgs = Array.from(document.querySelectorAll('img.gallery'));
    let idx = 0;

    imgs.forEach((img, i) => img.onclick = () => show(i));

    function show(i) {
      idx = (i + imgs.length) % imgs.length;
      document.getElementById('modalImg').src = imgs[idx].src;
      document.getElementById('modal').style.display = 'flex';
    }

    function move(step) { show(idx + step); }
  </script>
</body>
</html>
